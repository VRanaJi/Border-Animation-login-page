<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
    <title>Animated Page</title>
</head>
<body>
    <div class="box">
        <span class="borderline"></span>
        <form>
            <div class="input">
                <h2>Sign In</h2>
                <i></i>
            </div>
            <div class="input">
                <input type="text" required="required">
                <span>Username</span>
                <i></i>
            </div>
            <div class="input">
                <input type="text" required="required">
                <span>Password</span>
                <i></i>
            </div>
            <div class="link">
                <a href="#">Forget Password?</a>
                <a href="#">Create Account</a>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
